# 复制为 application-local.yml，或直接设置对应环境变量。
# Redis 默认连接 localhost:6379；远程环境请设置 REDIS_HOST、REDIS_PORT、REDIS_PASSWORD。
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY}}
      model-name: ${AI_CHAT_MODEL_NAME:glm-4.6}
      response-format: json_object
      max-tokens: ${AI_CHAT_MAX_TOKENS:8192}
      max-retries: ${AI_MODEL_MAX_RETRIES:3}
      timeout: ${AI_MODEL_TIMEOUT:300s}
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
      api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY}}
      model-name: ${AI_STREAMING_MODEL_NAME:glm-4.6}
      max-tokens: ${AI_STREAMING_MAX_TOKENS:8192}
      temperature: ${AI_STREAMING_TEMPERATURE:0.1}
      timeout: ${AI_MODEL_TIMEOUT:300s}
      log-requests: true
      log-responses: true
    reasoning-streaming-chat-model:
      base-url: ${AI_REASONING_BASE_URL:${AI_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}}
      api-key: ${AI_REASONING_API_KEY:${AI_API_KEY:${DEEPSEEK_API_KEY}}}
      model-name: ${VUE_REASONING_MODEL_NAME:${AI_STREAMING_MODEL_NAME:glm-4.6}}
      max-tokens: ${VUE_REASONING_MAX_TOKENS:32768}
      temperature: ${VUE_REASONING_TEMPERATURE:0.1}
      timeout: ${VUE_REASONING_TIMEOUT:${AI_MODEL_TIMEOUT:300s}}
      log-requests: true
      log-responses: true
    # 路由任务输出很短，可独立使用低成本模型；未配置时会复用上面的聊天模型。
    routing-chat-model:
      base-url: ${ROUTING_AI_BASE_URL:${AI_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}}
      api-key: ${ROUTING_AI_API_KEY:${AI_API_KEY:${DEEPSEEK_API_KEY}}}
      model-name: ${ROUTING_AI_MODEL_NAME:${AI_CHAT_MODEL_NAME:glm-4.6}}
      max-tokens: 100
      temperature: 0.0
      timeout: ${ROUTING_AI_TIMEOUT:${AI_MODEL_TIMEOUT:300s}}

# 默认使用智谱 GLM-4.6 Coding Plan；也可通过 AI_BASE_URL、AI_API_KEY 和模型名切换供应商。
# AI_CHAT_MEMORY_MAX_MESSAGES=50
# AI_MODEL_MAX_RETRIES=3

# 可选：部署后自动生成封面。建议通过环境变量配置，避免提交密钥。
# COS_ENABLED=true
# COS_HOST=https://your-custom-domain.example.com
# COS_SECRET_ID=your-secret-id
# COS_SECRET_KEY=your-secret-key
# COS_REGION=ap-shanghai
# COS_BUCKET=your-bucket-name
# CHROME_DRIVER_PATH=/absolute/path/to/chromedriver
# CHROME_BINARY_PATH=/absolute/path/to/chrome
# APP_DEPLOY_HOST=https://your-deploy-domain.example.com
# Docker 环境若 Chrome 沙箱不可用，可设置 SCREENSHOT_NO_SANDBOX=true。

# 可选：Agent 工作流图片素材能力。缺失配置时会自动跳过对应图片类型。
# PEXELS_API_KEY=your-pexels-api-key
# DASHSCOPE_API_KEY=your-dashscope-api-key
# DASHSCOPE_IMAGE_MODEL=wan2.2-t2i-flash
# unDraw 的 Next.js buildId 会变化；抓取实际请求后再配置完整模板，保留两个 %s 占位符。
# UNDRAW_URL_TEMPLATE=https://undraw.co/_next/data/<build-id>/search/%s.json?term=%s
