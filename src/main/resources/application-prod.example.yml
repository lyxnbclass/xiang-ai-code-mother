# 复制为 application-prod.yml 后使用，敏感信息请通过环境变量注入。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/xiang_ai_code_mother}
    username: ${DB_USERNAME:xiang_ai_code_mother_user}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      ttl: ${REDIS_CHAT_MEMORY_TTL:3600}

langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY}
      model-name: ${AI_CHAT_MODEL_NAME:deepseek-chat}
      response-format: json_object
      max-tokens: ${AI_CHAT_MAX_TOKENS:8192}
      max-retries: ${AI_MODEL_MAX_RETRIES:3}
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY}
      model-name: ${AI_STREAMING_MODEL_NAME:deepseek-chat}
      max-tokens: ${AI_STREAMING_MAX_TOKENS:8192}
      log-requests: false
      log-responses: false
    reasoning-streaming-chat-model:
      base-url: ${AI_REASONING_BASE_URL:${AI_BASE_URL:https://api.deepseek.com}}
      api-key: ${AI_REASONING_API_KEY:${DEEPSEEK_API_KEY}}
      model-name: ${VUE_REASONING_MODEL_NAME:deepseek-chat}
      max-tokens: ${VUE_REASONING_MAX_TOKENS:8192}
      temperature: ${AI_REASONING_TEMPERATURE:0.1}
      log-requests: false
      log-responses: false
    routing-chat-model:
      base-url: ${ROUTING_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${ROUTING_AI_API_KEY:${DASHSCOPE_API_KEY:${DEEPSEEK_API_KEY}}}
      model-name: ${ROUTING_AI_MODEL_NAME:qwen-turbo}
      max-tokens: ${ROUTING_AI_MAX_TOKENS:100}
      temperature: 0.0

cos:
  client:
    enabled: ${COS_ENABLED:false}
    host: ${COS_HOST:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}

workflow:
  images:
    pexels-api-key: ${PEXELS_API_KEY:}
    undraw-url-template: ${UNDRAW_URL_TEMPLATE:}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-model: ${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}

screenshot:
  enabled: ${SCREENSHOT_ENABLED:true}
  no-sandbox: ${SCREENSHOT_NO_SANDBOX:true}
  driver-path: ${CHROME_DRIVER_PATH:}
  browser-path: ${CHROME_BINARY_PATH:}

code:
  deploy-host: ${APP_DEPLOY_HOST:http://localhost/dist}

mybatis-flex:
  configuration:
    log-impl: ''

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  basic:
    enable: ${KNIFE4J_BASIC_AUTH_ENABLED:true}
    username: ${KNIFE4J_USERNAME:root}
    password: ${KNIFE4J_PASSWORD}
