spring:
  application:
    name: shawn-ai-code-mother-backend
  session:
    store-type: redis
    timeout: 30d
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/xiang_ai_code_mother}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      ttl: ${REDIS_CHAT_MEMORY_TTL:3600}
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 30d
        http-only: true
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.xiang.xiangaicodemother.controller
# Knife4j 接口文档
knife4j:
  enable: true
  setting:
    language: zh_cn

# 部署后封面截图。COS 未启用时会自动跳过，不影响应用部署。
screenshot:
  enabled: ${SCREENSHOT_ENABLED:true}
  width: ${SCREENSHOT_WIDTH:1600}
  height: ${SCREENSHOT_HEIGHT:900}
  page-load-timeout-seconds: ${SCREENSHOT_PAGE_LOAD_TIMEOUT:30}
  ready-timeout-seconds: ${SCREENSHOT_READY_TIMEOUT:10}
  render-delay-millis: ${SCREENSHOT_RENDER_DELAY:2000}
  max-concurrency: ${SCREENSHOT_MAX_CONCURRENCY:2}
  no-sandbox: ${SCREENSHOT_NO_SANDBOX:false}
  driver-path: ${CHROME_DRIVER_PATH:}
  browser-path: ${CHROME_BINARY_PATH:}

# 腾讯云 COS。密钥只通过环境变量或不入库的 application-local.yml 提供。
cos:
  client:
    enabled: ${COS_ENABLED:false}
    host: ${COS_HOST:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}

# AI 工作流图片素材能力。未配置密钥时自动跳过对应能力，不影响代码生成。
workflow:
  max-quality-retries: ${WORKFLOW_MAX_QUALITY_RETRIES:1}
  images:
    pexels-api-key: ${PEXELS_API_KEY:}
    undraw-url-template: ${UNDRAW_URL_TEMPLATE:}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-model: ${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}
    max-results-per-task: ${WORKFLOW_IMAGE_MAX_RESULTS:6}

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    redis-enabled: ${RATE_LIMIT_REDIS_ENABLED:true}
# http://localhost:8123/api/doc.html#/home
