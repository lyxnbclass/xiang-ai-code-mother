spring:
  application:
    name: ${USER_SERVICE_NAME:xiang-ai-code-user}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:30d}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/xiang_ai_code_mother}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}

server:
  port: ${USER_SERVER_PORT:8124}
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: ${SESSION_COOKIE_MAX_AGE:30d}
        http-only: true

springdoc:
  group-configs:
    - group: default
      packages-to-scan: com.xiang.xiangaicodeuser.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848?username=nacos&password=nacos}
    register-mode: instance
  protocol:
    name: tri
    port: ${USER_DUBBO_PORT:50051}
  consumer:
    timeout: ${DUBBO_CONSUMER_TIMEOUT:60000}
  provider:
    timeout: ${DUBBO_PROVIDER_TIMEOUT:60000}
